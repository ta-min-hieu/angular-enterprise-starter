<span
  nz-dropdown
  [nzDropdownMenu]="langMenu"
  class="inline-flex items-center gap-xs px-sm h-8 rounded-full cursor-pointer text-text bg-info/10 hover:bg-info/20 transition-colors"
  tabindex="0"
  [attr.aria-label]="i18nService.locale().toUpperCase()"
>
  <span nz-icon nzType="global" class="text-body text-info"></span>
  <span class="text-label">{{ i18nService.locale().toUpperCase() }}</span>
</span>

<nz-dropdown-menu #langMenu="nzDropdownMenu">
  <ul nz-menu>
    @for (locale of i18nService.availableLocales; track locale.code) {
      <li nz-menu-item [nzSelected]="locale.code === i18nService.locale()">
        <button
          type="button"
          class="app-language-switcher__option w-full border-none bg-transparent text-inherit text-left cursor-pointer"
          (click)="selectLocale(locale.code)"
        >
          {{ locale.label }}
        </button>
      </li>
    }
  </ul>
</nz-dropdown-menu>
